name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev
      - main

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener diff del PR
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          # Truncar a 12000 caracteres para no exceder el límite de la API
          DIFF="${DIFF:0:12000}"
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Obtener info del PR
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('title', pr.data.title);
            core.setOutput('body', pr.data.body || '');
            core.setOutput('base', pr.data.base.ref);
            core.setOutput('head', pr.data.head.ref);

      - name: Review con Claude
        id: claude_review
        run: |
          PROMPT="Eres un code reviewer experto para el proyecto synergy-irving-tcg (ecommerce TCG en React + Vite + TypeScript + Tailwind + Express.js + Supabase). Revisa el siguiente PR siguiendo los estándares del proyecto Synergy.

          PR: ${{ steps.pr_info.outputs.title }}
          Base: ${{ steps.pr_info.outputs.base }} ← Head: ${{ steps.pr_info.outputs.head }}
          Descripción: ${{ steps.pr_info.outputs.body }}

          DIFF:
          ${{ steps.diff.outputs.diff }}

          Proporciona un review en español con las siguientes secciones:
          ## Resumen
          Qué hace este PR en 2-3 líneas.

          ## Calidad de código
          Corrección, legibilidad, convenciones del proyecto (Tailwind, TypeScript estricto, sin console.log, comentarios en español, mobile-first).

          ## Seguridad
          API keys expuestas, RLS de Supabase, validaciones en backend, XSS, SQL injection.

          ## Rendimiento
          Lazy loading, queries innecesarias, re-renders, tamaño de bundle.

          ## Sugerencias
          Lista puntual de mejoras concretas con el archivo y línea si aplica.

          ## Veredicto
          ✅ Aprobado | ⚠️ Aprobado con sugerencias | ❌ Cambios requeridos"

          RESPONSE=$(curl -s https://api.anthropic.com/v1/messages \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d "{
              \"model\": \"claude-sonnet-4-6\",
              \"max_tokens\": 2048,
              \"messages\": [{
                \"role\": \"user\",
                \"content\": $(echo "$PROMPT" | jq -Rs .)
              }]
            }")

          REVIEW=$(echo "$RESPONSE" | jq -r '.content[0].text // "Error al obtener el review de Claude."')
          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publicar review como comentario
        uses: actions/github-script@v7
        with:
          script: |
            const review = `## 🤖 AI Code Review — Synergy

            ${{ steps.claude_review.outputs.review }}

            ---
            *Generado automáticamente por Claude. Emiliano aprueba y hace merge.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review
            });
